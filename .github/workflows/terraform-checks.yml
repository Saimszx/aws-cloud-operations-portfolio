name: Terraform Checks

on:
  push:
    paths:
      - "projects/01-aws-observability-incident-response/terraform/**"
      - "projects/01-aws-observability-incident-response/scripts/**"
      - ".github/workflows/terraform-checks.yml"
  pull_request:
    paths:
      - "projects/01-aws-observability-incident-response/terraform/**"
      - "projects/01-aws-observability-incident-response/scripts/**"
      - ".github/workflows/terraform-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/01-aws-observability-incident-response/terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Test security and cost controls
        run: terraform test -no-color
