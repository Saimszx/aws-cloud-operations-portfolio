name: Infrastructure Checks

on:
  push:
    paths:
      - "identity/**"
      - "projects/01-aws-observability-incident-response/terraform/**"
      - "projects/01-aws-observability-incident-response/scripts/**"
      - ".github/workflows/terraform-checks.yml"
  pull_request:
    paths:
      - "identity/**"
      - "projects/01-aws-observability-incident-response/terraform/**"
      - "projects/01-aws-observability-incident-response/scripts/**"
      - ".github/workflows/terraform-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudformation:
    name: Validate IAM bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint==1.55.1

      - name: Validate CloudFormation syntax and schema
        run: cfn-lint --format pretty --regions us-east-2 -- identity/bootstrap.yaml

      - name: Evaluate IAM policy-as-code rules
        uses: aws-cloudformation/cloudformation-guard@0e1dc63f667c80e3b9ed1aea2ba1cf6c8d588298 # action-v0.0.5
        with:
          rules: identity/rules/identity-bootstrap.guard
          data: identity/bootstrap.yaml
          checkout: "false"
          analyze: "false"
          create-review: "false"

  terraform:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/01-aws-observability-incident-response/terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Test security and cost controls
        run: terraform test -no-color

      - name: Test cleanup verifier without AWS access
        shell: pwsh
        run: ../scripts/tests/verify-cleanup.tests.ps1
